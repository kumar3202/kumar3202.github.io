<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>messages from the world</title>
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon/favicon-32x32.png?v=moon25">
    <link rel="shortcut icon" href="images/favicon/favicon.ico?v=moon25" type="image/x-icon">
    <style>
      @font-face {
        font-family: "Cordata";
        src: url("fonts/cordata.woff2") format("woff2");
        font-display: swap;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #B2CEDE;
        color: #1e3a2f;
        font-family: "Cordata", monospace;
        font-size: 16px;
        -webkit-font-smoothing: none;
        min-height: 100vh;
      }
      a { color: #0b5f8a; text-decoration-style: dotted; text-underline-offset: 2px; }
      a:visited { color: #2a6b55; }
      .gallery {
        display: flex;
        gap: 15px;
        margin: 15px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .gallery a.thumb {
        display: block;
        line-height: 0;
        text-decoration: none;
      }
      .gallery a.thumb img {
        aspect-ratio: 9 / 16;
        max-height: calc(100vh - 30px);
        outline: 1px dotted rgba(255, 255, 255, 0.85);
        box-shadow: 1px 1px rgba(35, 80, 90, 0.4), -1px -1px rgba(35, 80, 90, 0.4);
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      .gallery a.thumb:hover img,
      .gallery a.thumb:focus img {
        outline: 1px solid white;
      }
      header {
        margin: 15px auto;
        background: rgba(255, 255, 255, 0.78);
        outline: 1px dotted rgba(255, 255, 255, 0.9);
        box-shadow: 0 1px rgba(30, 100, 80, 0.35), 0 -1px rgba(30, 100, 80, 0.35);
      }
      header div { width: fit-content; margin: auto; padding: 15px; }
      h1 {
        margin: 0;
        font-size: 2.25rem;
        font-weight: normal;
        line-height: 1;
        text-wrap: balance;
        text-align: center;
      }
      nav { margin-top: 5px; display: flex; justify-content: space-between; }

      /* click a thumb → this opens (no JS) */
      .viewer {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 50;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .viewer:target {
        display: flex;
      }
      .viewer-bg {
        position: absolute;
        inset: 0;
        background: rgba(20, 40, 50, 0.72);
        text-decoration: none;
      }
      .polaroid {
        position: relative;
        z-index: 2;
        background: #fff;
        padding: 14px 14px 22px;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.45);
        outline: 1px solid rgba(0, 0, 0, 0.35);
        max-width: min(860px, 92vw);
        max-height: calc(100vh - 40px);
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .polaroid img {
        display: block;
        width: 100%;
        height: auto;
        max-height: calc(100vh - 160px);
        object-fit: contain;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        border: 2px inset rgba(0, 0, 0, 0.35);
      }
      .polaroid figcaption {
        margin-top: 14px;
        background: #fff;
        color: #111;
        border: 1px solid #111;
        padding: 8px 12px;
        text-align: center;
        font-size: 0.95rem;
        line-height: 1.35;
        width: fit-content;
        max-width: 100%;
      }
      .polaroid .when { display: block; }
      .polaroid .where {
        display: block;
        margin-top: 2px;
        color: #444;
        font-size: 0.85rem;
      }
      .viewer-close {
        position: absolute;
        top: 12px;
        right: 16px;
        z-index: 3;
        color: #fff;
        font-size: 1.5rem;
        text-decoration: none;
        text-shadow: 1px 1px 0 #000;
      }
      .viewer-close:hover,
      .viewer-close:focus {
        color: khaki;
      }

      @media (max-width: 560px) {
        .polaroid { padding: 10px 10px 14px; }
        .polaroid figcaption { font-size: 0.8rem; padding: 6px 8px; }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>messages from the world</h1>
        <nav>
          <span>← <a href="album.html">more photos</a></span>
        </nav>
      </div>
    </header>

    <div class="gallery">
      <a class="thumb" href="#genspark" title="open photo">
        <img loading="lazy" src="images/messages/2026-10-genspark.png?v=17" alt="one prompt, job gone! genspark.ai subway ad">
      </a>
    </div>

    <div id="genspark" class="viewer">
      <a class="viewer-bg" href="#" aria-label="close"></a>
      <a class="viewer-close" href="#" aria-label="close">×</a>
      <figure class="polaroid">
        <img src="images/messages/2026-10-genspark-full.png?v=3" alt="one prompt, job gone! genspark.ai subway ad">
        <figcaption>
          <span class="when"> aug 23, 2026 at 11:05pm</span>
          <span class="where">nyc subway</span>
        </figcaption>
      </figure>
    </div>
  </body>
</html>
