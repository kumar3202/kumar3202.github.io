<!DOCTYPE HTML>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>photo galleries</title>
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon/favicon-32x32.png?v=moon25">
    <link rel="shortcut icon" href="images/favicon/favicon.ico?v=moon25" type="image/x-icon">
    <style>
      @font-face {
        font-family: "Cordata";
        src: url("fonts/cordata.woff2") format("woff2");
        font-display: swap;
      }

      html {
        image-rendering: pixelated;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body.photos-page {
        min-height: 100vh;
        background-color: #0e1c33;
        background-image:
          radial-gradient(ellipse 80% 55% at 50% 18%, rgba(90, 140, 200, 0.28), transparent 70%),
          radial-gradient(ellipse 100% 80% at 50% 100%, rgba(8, 14, 28, 0.9), transparent 55%),
          linear-gradient(165deg, #152849 0%, #0e1c33 45%, #0a1424 100%);
        background-attachment: fixed;
        color: #e8eef6;
        font-family: "Cordata", monospace;
        font-size: 16px;
        -webkit-font-smoothing: none;
        -moz-osx-font-smoothing: unset;
      }

      main {
        margin: 0 auto;
        padding: 15px;
        max-width: 50rem;
        text-align: center;
      }

      h1, h2 {
        font-weight: normal;
        line-height: 1;
      }

      h1, nav {
        margin: 2rem 0;
      }

      h1 {
        font-size: 2.75rem;
      }

      h2 {
        margin: 2.5rem auto 1rem;
        font-size: 1.25rem;
        text-transform: uppercase;
      }

      nav a {
        color: #9ec9f0;
        padding: 2px 1px 0 1px;
        text-decoration-style: dotted;
        text-underline-offset: 2px;
      }

      nav a:visited {
        color: #7eb8a8;
      }

      nav a:hover,
      nav a:focus {
        color: #0e1c33;
        background: #f0a85a;
        outline: 1px dotted #f0a85a;
        outline-offset: 1px;
      }

      .photopile {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        max-width: 100%;
      }

      .photopile a {
        display: inline-block;
        max-width: 90%;
        background: white;
        box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.55);
        outline: 1px solid rgba(0, 0, 0, 0.55);
        transform: rotate(2deg);
        margin: 0 -10px;
        color: black;
        text-decoration: none;
      }

      .photopile figure img {
        display: block;
        width: 11rem;
        max-width: calc(100% - 1.5rem);
        height: auto;
        margin: 0.75rem 0.75rem 0 0.75rem;
        border: 2px rgb(0, 0, 0, 0.55) inset;
        image-rendering: pixelated;
        object-fit: cover;
        aspect-ratio: 3 / 4;
      }

      .photopile figcaption {
        text-align: center;
        margin: 0.25rem 0.7rem 0.75rem 0.7rem;
        font-size: 1rem;
        color: black;
      }

      .photopile a:nth-child(2n) { transform: rotate(-7deg); }
      .photopile a:nth-child(3n) { transform: rotate(5deg); }
      .photopile a:nth-child(4n),
      .photopile:nth-of-type(2n) a:nth-child(2n) { transform: rotate(4deg); }
      .photopile a:nth-child(5n),
      .photopile:nth-of-type(2n) a { transform: rotate(-2deg); }
      .photopile a:nth-child(6n) { transform: rotate(-10deg); }

      .photopile a:hover,
      .photopile a:focus {
        outline: 1px solid rgba(0, 0, 0, 0.55);
        outline-offset: unset;
        transform: rotate(-5deg);
        z-index: 3;
        background: white;
      }
    </style>
  </head>
  <body class="photos-page">
    <main>
      <h1>photo galleries</h1>
      <div id="piles">
        <h2>grid type</h2>
        <div class="photopile">
          <a href="off-hours.html">
            <figure>
              <img src="images/off-hours/off%20hours.png" alt="off hours">
              <figcaption>off hours</figcaption>
            </figure>
          </a>
          <a href="messages.html">
            <figure>
              <img src="images/messages/messages.png" alt="messages from the world">
              <figcaption>messages from the world</figcaption>
            </figure>
          </a>
        </div>
      </div>
      <nav><a href="index.html">return home</a></nav>
    </main>
  </body>
</html>
